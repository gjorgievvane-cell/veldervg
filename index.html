<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>ВЕЛДЕР ВГ ТРЕЈДИНГ | Централно Греење & Машински Инсталации</title>
<style>
:root{
  --bg-dark:#050811;--bg-card:rgba(15,23,42,.65);--accent-blue:#00d2ff;--accent-glow:rgba(0,210,255,.45);
  --text-main:#f8fafc;--text-muted:#94a3b8;--border-color:rgba(255,255,255,.08);--nav-height:56px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --hh:calc(var(--nav-height) + var(--safe-top));
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth;background:var(--bg-dark);color:var(--text-main);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent}
a,button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:3px;border-radius:6px}
[id]{scroll-margin-top:calc(var(--hh) + 16px)}

/* NAV */
header{background:rgba(5,8,17,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:fixed;width:100%;top:0;left:0;z-index:1000;border-bottom:1px solid var(--border-color);height:var(--hh);padding-top:var(--safe-top)}
.nav-container{max-width:1024px;height:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 22px;gap:12px}
.logo-box{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.logo-icon{flex:none;width:32px;height:32px;background:linear-gradient(135deg,#00d2ff,#0055ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 0 14px var(--accent-glow)}
.logo-text{font-weight:700;font-size:.95rem;letter-spacing:-.2px;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:28px;align-items:center;list-style:none}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:.85rem;transition:color .3s}
.nav-links a:hover{color:#fff}
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:3px;border-radius:20px;flex:none}
.lang-btn{background:none;border:none;color:var(--text-muted);padding:4px 11px;min-height:30px;cursor:pointer;font-weight:600;font-size:.75rem;border-radius:14px;transition:all .3s}
.lang-btn.active{background:rgba(255,255,255,.22);color:#fff}
.menu-btn{display:none;flex-direction:column;justify-content:center;gap:6px;background:none;border:0;width:44px;height:44px;padding:0 12px;cursor:pointer;flex:none}
.menu-btn span{height:2px;background:#fff;border-radius:2px;transition:transform .3s}
.menu-btn.open span:first-child{transform:translateY(4px) rotate(45deg)}
.menu-btn.open span:last-child{transform:translateY(-4px) rotate(-45deg)}

/* VIEWS */
.view-section{display:none;min-height:100vh;min-height:100svh;padding-top:calc(var(--hh) + 32px)}
.view-section.active-view{display:block}

/* HERO */
.hero{min-height:80vh;min-height:80svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px 20px 70px;background:radial-gradient(circle at 50% 30%,rgba(0,210,255,.1) 0%,transparent 65%)}
.hero-title{font-size:clamp(1.9rem,4.6vw,3.2rem);font-weight:700;line-height:1.15;letter-spacing:-.015em;max-width:860px;margin-bottom:24px;background:linear-gradient(180deg,#fff 0%,#94a3b8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;overflow-wrap:break-word}
.hero-subtitle{font-size:clamp(.95rem,1.6vw,1.15rem);color:var(--text-muted);max-width:880px;margin-bottom:40px;font-weight:300;line-height:1.7}
.btn-cta{display:inline-block;background:linear-gradient(135deg,#00d2ff 0%,#0072ff 100%);color:#fff;padding:13px 30px;min-height:44px;border-radius:980px;text-decoration:none;font-weight:600;font-size:.9rem;text-align:center;transition:transform .3s,box-shadow .3s;box-shadow:0 4px 20px rgba(0,210,255,.3);border:none;cursor:pointer}
.btn-cta:hover{transform:scale(1.03);box-shadow:0 6px 28px rgba(0,210,255,.5)}

/* SYSTEM CARDS */
.systems-wrapper{max-width:820px;margin:0 auto;padding:60px 20px 100px;display:flex;flex-direction:column;gap:50px}
.system-card{display:block;color:inherit;text-decoration:none;background:var(--bg-card);border:1px solid var(--border-color);border-radius:24px;padding:42px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:.35;transform:scale(.96);transition:all .6s cubic-bezier(.16,1,.3,1);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.system-card.in-focus,.system-card:focus-visible{opacity:1;transform:scale(1);border-color:var(--accent-blue);box-shadow:0 0 35px var(--accent-glow),0 20px 40px rgba(0,0,0,.6)}
.card-header-flex{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.card-icon{font-size:2.2rem;line-height:1}
.system-card h3{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;color:#fff}
.system-card p{font-size:1.02rem;color:var(--text-muted);line-height:1.6;margin-bottom:26px;font-weight:300}

/* SUBPAGES */
.page-container{max-width:860px;margin:0 auto;padding:40px 20px 100px}
.back-nav{display:inline-flex;align-items:center;gap:8px;color:var(--accent-blue);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:30px;min-height:44px;transition:opacity .2s}
.back-nav:hover{opacity:.8}
.page-title{font-size:clamp(1.7rem,4vw,2.8rem);font-weight:700;color:#fff;margin-bottom:30px;letter-spacing:-.015em;line-height:1.2;overflow-wrap:break-word}
.page-text-content{color:var(--text-muted);font-size:clamp(1rem,1.5vw,1.08rem);line-height:1.8;font-weight:300}
.page-text-content p,.page-text-content h2{margin-bottom:20px}
.page-text-content h2{font-size:1rem;font-weight:600;color:#fff}
.page-text-content strong{color:#fff;font-weight:600}
.page-text-content ul{margin-left:24px;margin-bottom:24px}
.page-text-content li{margin-bottom:12px}
.page-cta-box{margin-top:60px;padding-top:30px;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.page-cta-box span{color:var(--text-muted);font-weight:300}

/* GALLERY */
.gallery-section{margin-top:48px}
.gallery-heading{font-size:1.05rem;font-weight:600;color:#fff;margin-bottom:18px;letter-spacing:-.005em}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.gallery-item{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:1px solid var(--border-color);background:var(--bg-card);cursor:pointer;padding:0;display:block;width:100%}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.gallery-item:hover img{transform:scale(1.06)}
.gallery-item.pdf-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-muted);font-size:.72rem;text-align:center;padding:10px}
.gallery-item.pdf-tile .pdf-icon{font-size:1.8rem}
.gallery-caption-mini{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:.68rem;color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery-empty{color:var(--text-muted);font-size:.92rem;font-weight:300;padding:22px;border:1px dashed var(--border-color);border-radius:14px;text-align:center}

#lightbox{position:fixed;inset:0;z-index:3000;background:rgba(3,5,10,.94);display:none;align-items:center;justify-content:center;padding:calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom))}
#lightbox.open{display:flex}
.lightbox-inner{max-width:min(94vw,1100px);max-height:90vh;display:flex;flex-direction:column;align-items:center;gap:12px}
.lightbox-inner img{max-width:100%;max-height:74vh;border-radius:10px;object-fit:contain}
.lightbox-inner iframe{width:min(90vw,900px);height:70vh;border:0;border-radius:10px;background:#fff}
.lightbox-caption{color:var(--text-muted);font-size:.88rem;text-align:center;max-width:90vw}
.lightbox-btn{position:fixed;background:rgba(255,255,255,.1);border:1px solid var(--border-color);color:#fff;border-radius:50%;width:44px;height:44px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lightbox-btn:hover{background:rgba(255,255,255,.22)}
#lightbox-close{top:calc(12px + var(--safe-top));right:12px}
#lightbox-prev{left:12px;top:50%;transform:translateY(-50%)}
#lightbox-next{right:12px;top:50%;transform:translateY(-50%)}
@media (max-width:600px){#lightbox-prev,#lightbox-next{width:38px;height:38px}}

/* CONTACT */
.contact-section{padding:90px 20px 100px;text-align:center;background:radial-gradient(circle at 50% 100%,rgba(0,210,255,.08) 0%,transparent 70%);border-top:1px solid var(--border-color)}
.contact-container{max-width:760px;margin:0 auto}
.contact-company{font-size:.85rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-blue);margin-bottom:10px}
.contact-headline{font-size:clamp(1.4rem,3.2vw,1.9rem);font-weight:700;letter-spacing:-.01em;color:#fff;margin-bottom:12px;line-height:1.25}
.contact-lead{font-size:.95rem;color:var(--text-muted);font-weight:300;line-height:1.6;margin:0 auto 28px;max-width:620px}
.contact-details-grid{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.contact-link{font-size:.95rem;font-weight:500;color:#fff;text-decoration:none;padding:8px 2px;transition:color .3s;overflow-wrap:anywhere}
.contact-link:hover{color:var(--accent-blue)}
.contact-loc{color:var(--text-muted);font-size:.9rem}
.contact-divider{width:4px;height:4px;border-radius:50%;background:var(--text-muted);opacity:.5}
.social-btns{display:flex;justify-content:center;gap:12px}
.btn-social{padding:10px 22px;min-height:44px;border-radius:980px;text-decoration:none;font-size:.85rem;font-weight:600;transition:all .3s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.viber{background:rgba(115,96,242,.12);color:#a294ff;border:1px solid rgba(115,96,242,.3)}
.viber:hover{background:#7360f2;color:#fff;box-shadow:0 0 20px rgba(115,96,242,.4);transform:translateY(-2px)}
.whatsapp{background:rgba(37,211,102,.12);color:#52ea8a;border:1px solid rgba(37,211,102,.3)}
.whatsapp:hover{background:#25d366;color:#fff;box-shadow:0 0 20px rgba(37,211,102,.4);transform:translateY(-2px)}

/* COOKIE */
#cookie-banner{position:fixed;bottom:calc(16px + var(--safe-bottom));left:16px;right:16px;max-width:680px;margin:0 auto;background:rgba(15,23,42,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);padding:16px 22px;border-radius:16px;z-index:2000;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .4s,opacity .4s}
#cookie-banner.hidden{transform:translateY(140%);opacity:0;pointer-events:none;visibility:hidden}
.cookie-text{font-size:.82rem;color:var(--text-muted);line-height:1.5;font-weight:300}
.btn-cookie{background:rgba(255,255,255,.15);color:#fff;border:none;padding:10px 20px;min-height:40px;border-radius:980px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-cookie:hover{background:var(--accent-blue);color:#050811}
footer{text-align:center;padding:24px 20px calc(24px + var(--safe-bottom));border-top:1px solid var(--border-color);color:var(--text-muted);font-size:.75rem}

/* BLUEPRINT BACKGROUND DRAWINGS */
.view-section{position:relative}
.page-container{position:relative;z-index:1}
.blueprint{position:fixed;top:var(--hh);left:0;right:0;bottom:0;z-index:0;opacity:.35;pointer-events:none;overflow:hidden}
.blueprint svg{width:100%;height:100%;display:block}
.bp-line{fill:none;stroke:var(--accent-blue);stroke-width:2.4;vector-effect:non-scaling-stroke}
.bp-line-thin{stroke-width:.8}
.bp-dash{stroke-dasharray:7 7}
.bp-draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:bpDraw 3.2s ease-out forwards}
@keyframes bpDraw{to{stroke-dashoffset:0}}
.bp-flow{stroke-dasharray:9 11;animation:bpFlow 2.4s linear infinite}
.bp-red{stroke:#ff5c5c}
.bp-blue{stroke:#38bdf8}
@keyframes bpFlow{to{stroke-dashoffset:-40}}
@media (max-width:768px){.blueprint{opacity:.3}}
@media (prefers-reduced-motion:reduce){.bp-draw{animation:none;stroke-dashoffset:0}.bp-flow{animation:none}}

/* LARGE SCREENS */
@media (min-width:1600px){html{font-size:112.5%}.nav-container{max-width:1200px}.systems-wrapper{max-width:920px}.page-container{max-width:960px}}
/* TABLET */
@media (min-width:769px) and (max-width:1024px){.nav-container{padding:0 28px}.systems-wrapper,.page-container{max-width:720px}}
/* PHONE */
@media (max-width:768px){
  .nav-container{padding:0 12px 0 18px}
  .lang-switch{margin-left:auto}
  .menu-btn{display:flex}
  .nav-links{position:fixed;left:0;right:0;top:var(--hh);flex-direction:column;align-items:stretch;gap:0;background:rgba(5,8,17,.97);padding:4px 22px 12px;border-bottom:1px solid var(--border-color);transform:translateY(-130%);visibility:hidden;transition:transform .35s,visibility .35s}
  .nav-links.open{transform:none;visibility:visible}
  .nav-links a{display:block;padding:16px 0;font-size:1.05rem;border-bottom:1px solid var(--border-color)}
  .nav-links li:last-child a{border-bottom:0}
  .hero{padding:90px 18px 56px}
  .btn-cta{width:100%}
  .systems-wrapper{padding:30px 16px 70px;gap:26px}
  .system-card{padding:26px 22px;border-radius:20px}
  .card-icon{font-size:1.8rem}
  .system-card h3{font-size:1.3rem}
  .system-card p{font-size:.98rem}
  .page-container{padding:24px 18px 80px}
  .page-text-content ul{margin-left:20px}
  .page-cta-box{flex-direction:column;align-items:stretch;text-align:center}
  .contact-section{padding:60px 18px 70px}
  .contact-divider{display:none}
  .contact-details-grid{flex-direction:column;gap:6px}
  .social-btns{flex-direction:column}
  .btn-social{width:100%}
  #cookie-banner{flex-direction:column;align-items:stretch;text-align:center;gap:12px}
}
@media (max-width:360px){.logo-text{font-size:.82rem}.logo-box{gap:8px}.lang-btn{padding:4px 8px}}
@media (max-height:480px) and (orientation:landscape){.hero{min-height:auto;padding-top:80px}}
@media (hover:none){.system-card{opacity:.7;transform:none}.system-card.in-focus{opacity:1}.btn-cta:hover{transform:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header{background:rgba(5,8,17,.97)}#cookie-banner{background:rgba(15,23,42,.98)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
const i18n = {
mk: {

"topli-title":"🔥 Централно Топловодно Греење",
"topli-p1":"Централното топловодно греење е еден од најзастапените, најбезбедните и поефикасните системи за загревање на станбени, деловни и индустриски објекти. Неговата основна функција се базира на циркулација на флуид (вода) кој се загрева во централен извор на топлина (котел, топлинска пумпа или градска топлинска централа) и се дистрибуира низ цевоводна мрежа до површинските грејни тела (подно, ѕидно или таванско греење) или конвенционалните емитери (радијатори и фенкоилери).",
"topli-strong1":"Клучни Сегменти & Изведба:",
"topli-li1-title":"Приклучни Подстаници (ЕСМ Дистрибуција):",
"topli-li1-desc":"Изведба на примарен и секундарен круг со високоефикасни компактни плочести изменувачи на топлина, автоматски диференцијални регулатори на притисок и проток, микропроцесорска регулација водена според надворешна температура и фреквентно контролирани циркулациони пумпи.",
"topli-li2-title":"Површински Грејни Системи:",
"topli-li2-desc":"Нискотемпературно подно, ѕидно и таванско греење изведено со висококвалитетни PEX-Al-PEX и PE-RT цевки, кои овозможуваат максимален термален комфор, рамномерна распределба на температурата и висока енергетска ефикасност.",
"topli-li3-title":"Радијаторско Греење:",
"topli-li3-desc":"Двоцевни дистрибутивни мрежи со термостатски вентили на радијаторите за прецизна поединечна зонска контрола на секоја просторија.",
"topli-li4-title":"Фенкоилерски Системи:",
"topli-li4-desc":"Двоцевни и четирицевни фенкоилерски инсталации за брза и динамична регулација на микроклимата во модерни станбени и деловни објекти.",

"geo-title":"🌍 Геотермални Системи",
"geo-p1":"Геотермалните системи претставуваат еден од најефикасните и најеколошките начини за греење, ладење и подготовка на топла санитарна вода (ТСВ). Нивната главна предност е искористувањето на стабилната температура на земјиштето или подземните води, која на одредена длабочина останува речиси константна во текот на целата година (помеѓу 10°C и 12°C на длабочина над 10–15 метри).",
"geo-p2":"Овие системи работат на принципот на геотермални топлински пумпи (вода-вода или земја-вода), користејќи го термодинамичкиот циклус за пренос на топлинска енергија со минимална потрошувачка на електрична енергија (за погон на компресорот и циркулационите пумпи).",
"geo-strong1":"Клучни Изведбени Решенија:",
"geo-li1-title":"Системи „Земја-Вода“ (Вертикални сонди / Хоризонтални колектори):",
"geo-li1-desc":"Инсталација на длабоки геотермални сонди или хоризонтални колекторски мрежи кои ја апсорбираат геотермалната енергија од земјиштето преку гликолен раствор.",
"geo-li2-title":"Системи „Вода-Вода“ (Бунарски системи):",

"geo-li3-title":"Интегрирано Греење, Ладење & ТСВ:",
"geo-li3-desc":"Флексибилни решенија со можност за слободно ладење (free-cooling) кое дополнително ги намалува трошоците за експлоатација во летниот период.",

"hp-title":"⚡ Топлински Пумпи (Воздух-Вода)",
"hp-p1":"Топлинските пумпи воздух-вода се еден од најзастапените и најекономичните системи за греење, ладење и подготовка на топла санитарна вода (ТСВ). Тие не произведуваат топлина со согорување на гориво, туку ја пренесуваат енергијата од надворешниот воздух во објектот, постигнувајќи висока ефикасност дури и при ниски зимски температури.",
"hp-strong1":"Принцип на Работа & Ефикасност:",
"hp-p2":"Системот работи на проверен термодинамички циклус со ладилен флуид и инвертерски компресор:",
"hp-li1-title":"COP (Коефициент на ефикасност при греење):",

"hp-li2-title":"EER / SEER:",

"hp-strong2":"Главни Предности:",

"hp-li4-title":"Мултифункционалност:",

"hp-li5-title":"Еколошка Одржливост:",
"hp-li5-desc":"Работа без локални емисии на штетни гасови и со можност за целосна интеграција со фотоволтаични системи.",

"vent-li2-title":"Локална и индустриска вентилација:",

"vent-li3-title":"Противпожарна вентилација:",

"vent-li4-title":"Сплит и мулти-сплит системи:",
"vent-li4-desc":"Флексибилни решенија идеални за помали станови, канцеларии и поединечни простории со висока енергетска класа.",
"vent-li5-title":"VRF / VRV системи:",

"topli-title":"🔥 Central District Heating",
"topli-p1":"Central district heating is one of the most widespread, safest, and efficient systems for heating residential, commercial, and industrial facilities. Its core operation is based on the circulation of a fluid (water) heated in a centralized source (boiler, heat pump, or municipal district heating plant) and distributed through a piping network to surface heating elements (underfloor, wall, or ceiling heating) or conventional emitters (radiators and fan coil units).",
"topli-strong1":"Key Segments & Execution:",
"topli-li1-title":"Connection Substations (ESM Distribution):",
"topli-li1-desc":"Execution of primary and secondary loops featuring high-efficiency compact plate heat exchangers, automatic differential pressure and flow regulators, outdoor-temperature-compensated microprocessor control, and frequency-controlled circulation pumps.",
"topli-li2-title":"Surface Heating Systems:",
"topli-li2-desc":"Low-temperature underfloor, wall, and ceiling heating executed with high-quality PEX-Al-PEX and PE-RT pipes, ensuring maximum thermal comfort, even temperature distribution, and high energy efficiency.",
"topli-li3-title":"Radiator Heating:",
"topli-li3-desc":"Two-pipe distribution networks equipped with thermostatic radiator valves for precise individual zone control in every room.",
"topli-li4-title":"Fan Coil Unit Systems:",
"topli-li4-desc":"Two-pipe and four-pipe fan coil installations for fast and dynamic microclimate regulation in modern residential and commercial spaces.",

"geo-title":"🌍 Geothermal Systems",
"geo-p1":"Geothermal systems represent one of the most efficient and eco-friendly solutions for heating, cooling, and domestic hot water (DHW) preparation. Their primary advantage lies in utilizing the stable temperature of the ground or groundwater, which remains nearly constant year-round at specific depths (between 10°C and 12°C at depths exceeding 10–15 meters).",
"geo-p2":"These systems operate on the thermodynamic cycle of geothermal heat pumps (water-to-water or ground-to-water), transferring thermal energy with minimal electricity consumption (powering the compressor and circulation pumps).",
"geo-strong1":"Key Execution Solutions:",
"geo-li1-title":"Ground-to-Water Systems (Vertical Probes / Horizontal Collectors):",
"geo-li1-desc":"Installation of deep geothermal probes or horizontal collector networks that absorb geothermal energy from the ground via a glycol solution.",
"geo-li2-title":"Water-to-Water Systems (Well Systems):",
"geo-li2-desc":"Utilization of well water as a direct and exceptionally rich energy source, offering top-tier performance (COP) and high seasonal efficiency.",
"geo-li3-title":"Integrated Heating, Cooling & DHW:",
"geo-li3-desc":"Flexible solutions featuring free-cooling capabilities that further reduce operational costs during the summer season.",

"hp-title":"⚡ Heat Pumps (Air-to-Water)",
"hp-p1":"Air-to-water heat pumps are among the most prevalent and economical systems for heating, cooling, and domestic hot water (DHW) preparation. They do not produce heat by burning fuel; instead, they transfer thermal energy from outside air into the building, achieving high efficiency even at low winter temperatures.",
"hp-strong1":"Operating Principle & Efficiency:",
"hp-p2":"The system operates on a proven thermodynamic cycle utilizing a refrigerant and an inverter compressor:",
"hp-li1-title":"COP (Coefficient of Performance for Heating):",
"hp-li1-desc":"Indicates the ratio between electrical energy input and thermal energy output. With high seasonal performance reaching up to 5.0 and above, for every 1 kWh of electricity consumed, the pump delivers a multiplied quantity of heat energy.",
"hp-li2-title":"EER / SEER:",
"hp-li2-desc":"Indicators of high energy efficiency during cooling in the summer period.",
"hp-strong2":"Main Advantages:",
"hp-li3-title":"Energy Savings:",
"hp-li3-desc":"Drastically reduced heating and cooling costs (up to 70% compared to conventional systems).",
"hp-li4-title":"Multifunctionality:",
"hp-li4-desc":"An integrated solution for year-round heating, cooling, and DHW preparation.",
"hp-li5-title":"Eco-Friendly Sustainability:",
"hp-li5-desc":"Zero local harmful gas emissions with full integration capabilities for photovoltaic systems.",

"vent-title":"🌬️ Ventilation & Air Conditioning",
"vent-p1":"Engineering systems for ventilation and air conditioning are crucial for ensuring optimal indoor air quality, microclimatic stability, and energy efficiency across all types of buildings.",
"vent-strong1":"Core Components & Categories:",
"vent-strong2":"Ventilation Systems:",
"vent-li1-title":"Forced (Mechanical) Ventilation:",
"vent-li1-desc":"Supply and exhaust air systems equipped with air handling units, heat recovery units (high-efficiency heat exchangers), and multi-stage filtration (G4, F7, HEPA classes).",
"vent-li2-title":"Local & Industrial Ventilation:",
"vent-li2-desc":"Effective extraction of pollutants, steam, and grease (professional kitchen hoods, exhaust systems in laboratories and industrial plants).",
"vent-li3-title":"Smoke & Fire Ventilation:",
"vent-li3-desc":"Smoke and heat exhaust ventilation systems (SHEVS) and maintenance of protective positive pressure in evacuation stairwells.",
"vent-strong3":"Air Conditioning Systems:",
"vent-li4-title":"Split & Multi-Split Systems:",
"vent-li4-desc":"Flexible solutions ideal for smaller apartments, offices, and individual rooms with high energy efficiency ratings.",
"vent-li5-title":"VRF / VRV Systems:",
"vent-li5-desc":"Centralized inverter systems with variable refrigerant flow, perfectly suited for office buildings, hotels, and larger residential developments.",
"vent-li6-title":"Chillers & Heat Pumps (Air-to-Water / Water-to-Water):",
"vent-li6-desc":"Central systems generating chilled and hot water to supply fan coil units and air handling units.",
"vent-li7-title":"Ducted Air Conditioning:",
"vent-li7-desc":"Integrated distribution of conditioned air through insulated ductwork with anemostats, grilles, and diffusers for uniform airflow and supreme indoor comfort.",

"plumb-title":"💧 Plumbing & Drainage",
"plumb-p1":"Water supply and drainage systems constitute a complex hydraulic infrastructure designed for continuous delivery of safe sanitary water under pressure and the safe collection and treatment of wastewater and stormwater.",

"plumb-li1-title":"Internal Water Supply Network:",
"plumb-li1-desc":"Design and execution of sanitary water supply and distribution systems utilizing proven, high-quality materials (PPR, multilayer pipes, galvanized and stainless steel) resistant to pressure and corrosion.",
"plumb-li2-title":"Drainage Systems:",
"plumb-li2-desc":"Efficient collection and gravity- or force-driven removal of wastewater and stormwater using certified plastic pipe systems (PVC, acoustically insulated PP systems, and robust HDPE piping networks).",
"plumb-li3-title":"Fire Hydrant Networks:",

"plumb-li4-title":"Booster Stations & Pump Units:",
"plumb-li4-desc":"Automated systems ensuring stable water pressure across all floors of a building, regardless of height and capacity.",
"plumb-strong2":"Execution Standards & Quality:",

}
};

/* ЦРТЕЖИ (CAD-стил, во позадина на секоја подстраница) */
const L = (x1,y1,x2,y2,c='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="bp-line ${c}"/>`;
const R = (x,y,w,h,c='') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="bp-line ${c}"/>`;
const Ci = (cx,cy,r,c='') => `<circle cx="${cx}" cy="${cy}" r="${r}" class="bp-line ${c}"/>`;
const Pa = (d,c='') => `<path d="${d}" class="bp-line ${c}"/>`;
const zig = (x,y,w,n,amp,c='') => {
  let pts = [], step = w / n;
  for (let i = 0; i <= n; i++) pts.push(`${x + i * step},${y + (i % 2 ? amp : -amp)}`);
  return `<polyline points="${pts.join(' ')}" class="bp-line ${c}"/>`;
};
const diffuser = (cx,cy) => Ci(cx,cy,10) + L(cx-10,cy,cx+10,cy) + L(cx,cy-10,cx,cy+10);
const compass = () => Ci(740,50,20) + L(722,50,758,50) + L(740,32,740,68);
const radiator = (x,y,w=40,h=16,c='') => {
  let s = R(x,y,w,h,c);
  const fins = 5, step = w / fins;
  for (let i = 1; i < fins; i++) { const fx = x + step * i; s += L(fx,y,fx,y+h,'bp-line-thin'); }
  return s;
};
const heatExchanger = (x,y,w=60,h=80,c='bp-draw') => {
  let s = R(x,y,w,h,c);
  const n = 6, step = h / (n + 1);
  for (let i = 1; i <= n; i++) { const ly = y + step * i; s += L(x+5,ly,x+w-5,ly-10,'bp-line-thin'); }
  return s;
};
const fanBlades = (cx,cy,r=24) => {
  let s = Ci(cx,cy,r);
  for (let a = 0; a < 360; a += 60) {
    const rad = a * Math.PI / 180;
    s += L(cx,cy,cx+r*.85*Math.cos(rad),cy+r*.85*Math.sin(rad),'bp-line-thin');
  }
  return s + Ci(cx,cy,4);
};
const louvers = (x,y,w,n) => {
  let s = '', step = w / n;
  for (let i = 0; i <= n; i++) { const lx = x + step * i; s += L(lx,y,lx,y+8,'bp-line-thin'); }
  return s;
};
const fanCoilUnit = (x,y,w=90,h=34) => {
  let s = R(x,y,w,h,'bp-draw');
  const n = 6, gap = w / (n + 1);
  for (let i = 1; i <= n; i++) { const lx = x + gap * i; s += L(lx,y+6,lx-6,y+h-6,'bp-line-thin'); }
  s += Ci(x+w-14,y+h/2,9) + L(x+w-21,y+h/2,x+w-7,y+h/2,'bp-line-thin') + L(x+w-14,y+h/2-7,x+w-14,y+h/2+7,'bp-line-thin');
  return s;
};

const bpFns = {
  toplifikacija(){
    let s = R(150,60,340,480,'bp-draw');
    [180,300,420].forEach(y => s += L(150,y,490,y,'bp-line-thin'));
    s += L(270,60,270,540,'bp-line-thin') + L(370,60,370,540,'bp-line-thin');
    s += heatExchanger(500,450,110,80) + Ci(525,475,11) + Ci(560,475,11) + Ci(545,510,9);
    s += L(520,450,520,90,'bp-red') + L(536,450,536,90,'bp-blue');
    [150,270,390,510].forEach(y => {
      s += L(520,y,180,y,'bp-line-thin') + L(536,y+10,200,y+10,'bp-line-thin');
      s += radiator(170,y-8,40,16) + radiator(280,y-8,40,16) + radiator(380,y-8,40,16);
    });
    s += L(60,540,700,540) + compass();
    return s;
  },
  geothermal(){
    let s = L(40,260,760,260);
    s += R(460,100,220,160,'bp-draw') + zig(480,240,180,8,6);
    s += R(430,190,50,50,'bp-draw') + Ci(455,215,14);
    s += L(455,240,455,270) + L(455,270,520,270) + L(520,270,520,240);
    [520,600].forEach(x => {
      s += L(x,270,x,560,'bp-red') + L(x+30,270,x+30,560,'bp-blue');
      s += Pa(`M${x},560 Q${x+15},580 ${x+30},560`);
      [340,420,500].forEach(y => { s += Ci(x,y,3) + Ci(x+30,y,3); });
    });
    s += compass();
    return s;
  },
  heatpumps(){
    let s = L(300,40,300,560,'bp-draw');
    s += R(140,420,110,70,'bp-draw') + fanBlades(195,455,24) + louvers(150,478,90,8);
    s += L(60,560,300,560);
    s += R(330,430,80,50,'bp-draw');
    s += L(250,450,300,450,'bp-blue') + L(250,465,300,465,'bp-red');
    s += L(370,430,370,260,'bp-blue') + L(390,430,390,260,'bp-red');
    s += zig(420,500,260,10,6) + fanCoilUnit(420,205,180,34);
    s += L(300,340,760,340,'bp-line-thin') + compass();
    return s;
  },
  ventilation(){
    let s = R(80,80,140,90,'bp-draw') + Ci(120,125,18) + Ci(180,125,18);
    s += L(220,125,680,125,'bp-draw');
    [320,460,600].forEach(x => { s += L(x,125,x,260) + diffuser(x,270); });
    [320,600].forEach(x => { s += L(x,300,x,420) + diffuser(x,430); });
    s += L(80,300,680,300,'bp-line-thin') + L(80,460,680,460,'bp-line-thin');
    s += L(60,560,720,560) + compass();
    return s;
  },
  plumbing(){
    let s = R(180,60,420,480,'bp-draw');
    [180,300,420].forEach(y => s += L(180,y,600,y,'bp-line-thin'));
    s += L(560,60,560,500,'bp-blue') + L(600,60,600,500,'bp-red');
    [150,270,390].forEach(y => {
      s += L(560,y,260,y,'bp-line-thin') + L(600,y+10,300,y+10,'bp-line-thin');
      s += R(230,y-6,30,18) + Pa(`M230,${y-6} q15,-14 30,0`) + R(280,y+4,26,10);
    });
    s += R(520,500,90,50,'bp-draw') + Ci(565,525,14);
    s += Ci(110,520,16) + R(102,494,16,20);
    s += L(60,540,700,540) + compass();
    return s;
  }
};

/* ГАЛЕРИЈА (слики, шеми, цртежи по подстраница) */
/* За да додадеш нова ставка: прикачи ја датотеката во images/<id>/ на GitHub,
   потоа додади еден ред тука: {file:'име-на-датотека.jpg', caption:{mk:'...',en:'...'}} за слика,
   или {file:'документ.pdf', type:'pdf', caption:{mk:'...',en:'...'}} за PDF шема/цртеж. */
const gallery = {
  toplifikacija: [],
  geothermal: [],
  heatpumps: [],
  ventilation: [],
  plumbing: []
};

function galleryItemsHtml(id) {
  const items = gallery[id] || [];
  if (!items.length) {
    return `<div class="gallery-empty" data-i18n="gallery-empty"></div>`;
  }
  return `<div class="gallery-grid">` + items.map((it, i) => {
    const src = `images/${id}/${it.file}`;
    if (it.type === 'pdf') {
      return `<button type="button" class="gallery-item pdf-tile" data-id="${id}" data-index="${i}" aria-label="PDF">
        <span class="pdf-icon" aria-hidden="true">📄</span><span data-i18n-caption>${it.file}</span></button>`;
    }
    return `<button type="button" class="gallery-item" data-id="${id}" data-index="${i}" aria-label="${it.file}">
      <img src="${src}" alt="" loading="lazy" onerror="this.closest('.gallery-item').style.display='none'">
    </button>`;
  }).join('') + `</div>`;
}

let lbState = { id: null, index: 0 };
function openLightbox(id, index) {
  lbState = { id, index };
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function navLightbox(dir) {
  const items = gallery[lbState.id] || [];
  if (!items.length) return;
  lbState.index = (lbState.index + dir + items.length) % items.length;
  renderLightbox();
}
function renderLightbox() {
  const items = gallery[lbState.id] || [];
  const it = items[lbState.index];
  if (!it) return;
  const lang = document.documentElement.lang === 'en' ? 'en' : 'mk';
  const cap = (it.caption && it.caption[lang]) || '';
  const src = `images/${lbState.id}/${it.file}`;
  const inner = document.getElementById('lightbox-inner');
  inner.innerHTML = it.type === 'pdf'
    ? `<iframe src="${src}" title="${it.file}"></iframe>`
    : `<img src="${src}" alt="">`;
  document.getElementById('lightbox-caption').textContent = cap;
  const multi = items.length > 1;
  document.getElementById('lightbox-prev').style.display = multi ? 'flex' : 'none';
  document.getElementById('lightbox-next').style.display = multi ? 'flex' : 'none';
}
document.addEventListener('click', e => {
  const item = e.target.closest('.gallery-item');
  if (item) { openLightbox(item.dataset.id, Number(item.dataset.index)); return; }
  if (e.target.closest('#lightbox-close')) closeLightbox();
  if (e.target.closest('#lightbox-prev')) navLightbox(-1);
  if (e.target.closest('#lightbox-next')) navLightbox(1);
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

/* ПОДСТРАНИЦИ: p = параграф, h = наслов, l = листа со наслов+опис (од-до), q = проста листа */
const pages = {
  toplifikacija: ['topli', ['p','p1'], ['h','strong1'], ['l',1,4]],
  geothermal:    ['geo',   ['p','p1'], ['p','p2'], ['h','strong1'], ['l',1,3]],
  heatpumps:     ['hp',    ['p','p1'], ['h','strong1'], ['p','p2'], ['l',1,2], ['h','strong2'], ['l',3,5]],
  ventilation:   ['vent',  ['p','p1'], ['h','strong1'], ['h','strong2'], ['l',1,3], ['h','strong3'], ['l',4,7]],
  plumbing:      ['plumb', ['p','p1'], ['h','strong1'], ['l',1,4], ['h','strong2'], ['q',5,6]]
};

function buildPages() {
  const t = (tag, key, cls) => `<${tag}${cls ? ' class="' + cls + '"' : ''} data-i18n="${key}"></${tag}>`;
  let html = '';
  for (const [id, [pre, ...blocks]] of Object.entries(pages)) {
    let body = '';
    for (const [type, a, b] of blocks) {
      if (type === 'p') body += t('p', `${pre}-${a}`);
      else if (type === 'h') body += t('h2', `${pre}-${a}`);
      else {
        body += '<ul>';
        for (let n = a; n <= b; n++) {
          body += type === 'l'
            ? `<li><strong data-i18n="${pre}-li${n}-title"></strong> <span data-i18n="${pre}-li${n}-desc"></span></li>`
            : `<li data-i18n="${pre}-li${n}"></li>`;
        }
        body += '</ul>';
      }
    }
    html += `<div id="view-${id}" class="view-section">
      <div class="blueprint" aria-hidden="true"><svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">${bpFns[id]()}</svg></div>
      <div class="page-container">
      <a class="back-nav" href="#systems">&larr; <span data-i18n="back-home"></span></a>
      ${t('h1', pre + '-title', 'page-title')}
      <div class="page-text-content">${body}</div>
      <div class="gallery-section">
        <h2 class="gallery-heading" data-i18n="gallery-title"></h2>
        ${galleryItemsHtml(id)}
      </div>
      <div class="page-cta-box"><span data-i18n="page-cta-text"></span>
        <a href="#contact" class="btn-cta" data-i18n="modal-cta"></a></div>
    </div></div>`;
  }
  document.getElementById('subpages').innerHTML = html;
}

/* ЈАЗИК */
function setLanguage(lang, save) {
  if (!i18n[lang]) lang = 'mk';
  document.documentElement.lang = lang === 'mk' ? 'mk' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = i18n[lang][el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.title = i18n[lang]['page-title'];
  ['mk', 'en'].forEach(l => {
    const b = document.getElementById('btn-' + l);
    b.classList.toggle('active', l === lang);
    b.setAttribute('aria-pressed', l === lang);
  });
  document.getElementById('menu-btn').setAttribute('aria-label', lang === 'mk' ? 'Мени' : 'Menu');
  if (save) { try { localStorage.setItem('velder_lang', lang); } catch (e) {} }
}

/* МЕНИ */
const menuBtn = document.getElementById('menu-btn');
const navLinks = document.getElementById('nav-links');
function closeMenu() {
  navLinks.classList.remove('open');
  menuBtn.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
}
menuBtn.addEventListener('click', () => {
  const open = navLinks.classList.toggle('open');
  menuBtn.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open);
});
navLinks.addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });
window.addEventListener('resize', () => { if (innerWidth > 768) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

/* РУТИРАЊЕ (#toplifikacija, #geothermal ... и сидра #about, #systems, #contact) */
function route() {
  const hash = decodeURIComponent(location.hash.slice(1));
  const view = pages[hash] ? hash : 'home';
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-view'));
  document.getElementById('view-' + view).classList.add('active-view');
  closeMenu();
  const target = view === 'home' && hash && document.getElementById(hash);
  if (target) target.scrollIntoView({ behavior: 'smooth' });
  else window.scrollTo({ top: 0, behavior: 'auto' });
}
window.addEventListener('hashchange', route);

/* КОЛАЧИЊА */
const cookieBanner = document.getElementById('cookie-banner');
try { if (localStorage.getItem('velder_cookies_accepted') === 'true') cookieBanner.classList.add('hidden'); } catch (e) {}
document.getElementById('cookie-accept-btn').addEventListener('click', () => {
  try { localStorage.setItem('velder_cookies_accepted', 'true'); } catch (e) {}
  cookieBanner.classList.add('hidden');
});

/* ИСКРА НА КАРТИЧКИТЕ */
const focusObserver = new IntersectionObserver(entries => {
  entries.forEach(en => en.target.classList.toggle('in-focus', en.isIntersecting));
}, { rootMargin: '-30% 0px -30% 0px', threshold: 0.2 });
document.querySelectorAll('.system-card').forEach(c => focusObserver.observe(c));

/* СТАРТ */
buildPages();
let startLang = 'mk';
try { startLang = localStorage.getItem('velder_lang') || 'mk'; } catch (e) {}
setLanguage(startLang);
document.getElementById('btn-mk').addEventListener('click', () => setLanguage('mk', true));
document.getElementById('btn-en').addEventListener('click', () => setLanguage('en', true));
route();
</script>
</body>
</html>
