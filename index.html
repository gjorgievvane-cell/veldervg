<style>
:root{
  --bg-dark:#050811;--bg-card:rgba(15,23,42,.65);--accent-blue:#00d2ff;--accent-glow:rgba(0,210,255,.45);
  --text-main:#f8fafc;--text-muted:#94a3b8;--border-color:rgba(255,255,255,.08);--nav-height:56px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --hh:calc(var(--nav-height) + var(--safe-top));
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth;background:var(--bg-dark);color:var(--text-main);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);-webkit-tap-highlight-color:transparent}
a,button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent-blue);outline-offset:3px;border-radius:6px}
[id]{scroll-margin-top:calc(var(--hh) + 16px)}

/* NAV */
header{background:rgba(5,8,17,.8);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:fixed;width:100%;top:0;left:0;z-index:1000;border-bottom:1px solid var(--border-color);height:var(--hh);padding-top:var(--safe-top)}
.nav-container{max-width:1024px;height:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:0 22px;gap:12px}
.logo-box{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.logo-icon{flex:none;width:32px;height:32px;background:linear-gradient(135deg,#00d2ff,#0055ff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 0 14px var(--accent-glow)}
.logo-text{font-weight:700;font-size:.95rem;letter-spacing:-.2px;color:#f8fafc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:28px;align-items:center;list-style:none}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:.85rem;transition:color .3s}
.nav-links a:hover{color:#fff}
.lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);padding:3px;border-radius:20px;flex:none}
.lang-btn{background:none;border:none;color:var(--text-muted);padding:4px 11px;min-height:30px;cursor:pointer;font-weight:600;font-size:.75rem;border-radius:14px;transition:all .3s}
.lang-btn.active{background:rgba(255,255,255,.22);color:#fff}
.menu-btn{display:none;flex-direction:column;justify-content:center;gap:6px;background:none;border:0;width:44px;height:44px;padding:0 12px;cursor:pointer;flex:none}
.menu-btn span{height:2px;background:#fff;border-radius:2px;transition:transform .3s}
.menu-btn.open span:first-child{transform:translateY(4px) rotate(45deg)}
.menu-btn.open span:last-child{transform:translateY(-4px) rotate(-45deg)}

/* VIEWS — флуид scroll-like транзиција (Apple-style) при смена на подстраница */
.view-section{display:none;min-height:100vh;min-height:100svh;padding-top:calc(var(--hh) + 32px);position:relative;opacity:0;transform:translateY(46px);transition:opacity .75s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1)}
.view-section.active-view{display:block}
.view-section.active-view.view-in{opacity:1;transform:none}

/* HERO */
.hero{min-height:80vh;min-height:80svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:110px 20px 70px;background:radial-gradient(circle at 50% 30%,rgba(0,210,255,.1) 0%,transparent 65%)}
.hero-title{font-size:clamp(1.9rem,4.6vw,3.2rem);font-weight:700;line-height:1.15;letter-spacing:-.015em;max-width:860px;margin-bottom:24px;background:linear-gradient(180deg,#fff 0%,#94a3b8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;overflow-wrap:break-word}
.hero-subtitle{font-size:clamp(.95rem,1.6vw,1.15rem);color:var(--text-muted);max-width:880px;margin-bottom:40px;font-weight:300;line-height:1.7}
.btn-cta{display:inline-block;background:linear-gradient(135deg,#00d2ff 0%,#0072ff 100%);color:#fff;padding:13px 30px;min-height:44px;border-radius:980px;text-decoration:none;font-weight:600;font-size:.9rem;text-align:center;transition:transform .3s,box-shadow .3s;box-shadow:0 4px 20px rgba(0,210,255,.3);border:none;cursor:pointer}
.btn-cta:hover{transform:scale(1.03);box-shadow:0 6px 28px rgba(0,210,255,.5)}

/* SYSTEM CARDS */
.systems-wrapper{max-width:820px;margin:0 auto;padding:60px 20px 100px;display:flex;flex-direction:column;gap:50px}
.system-card{display:block;color:inherit;text-decoration:none;background:var(--bg-card);border:1px solid rgba(0,210,255,calc(.08 + .92*var(--f,0)));border-radius:24px;padding:42px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 0 calc(35px*var(--f,0)) rgba(0,210,255,calc(.45*var(--f,0))),0 calc(10px + 10px*var(--f,0)) calc(30px + 10px*var(--f,0)) rgba(0,0,0,.5)}
.system-card:focus-visible{border-color:var(--accent-blue)}
.card-header-flex{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.card-icon{font-size:2.2rem;line-height:1}
.system-card h3{font-size:1.6rem;font-weight:700;letter-spacing:-.01em;color:#fff}
.system-card p{font-size:1.02rem;color:var(--text-muted);line-height:1.6;margin-bottom:26px;font-weight:300}

/* SUBPAGES */
.page-container{max-width:820px;margin:0 auto;padding:40px 20px 100px;position:relative;z-index:2}
.back-nav{display:inline-flex;align-items:center;gap:8px;color:var(--accent-blue);text-decoration:none;font-size:.9rem;font-weight:600;margin-bottom:30px;min-height:44px;transition:opacity .2s}
.back-nav:hover{opacity:.8}
.page-title{font-size:clamp(1.8rem,4.2vw,3rem);font-weight:700;color:#fff;margin-bottom:35px;letter-spacing:-.015em;line-height:1.15;overflow-wrap:break-word}

.page-text-content{
  color:#f1f5f9;
  font-size:clamp(1.02rem,1.5vw,1.12rem);
  line-height:1.85;
  font-weight:300;
}
.page-text-content p{margin-bottom:24px;color:#e2e8f0}
.page-text-content h2{font-size:1.15rem;font-weight:600;color:var(--accent-blue);letter-spacing:.02em;margin-top:36px;margin-bottom:16px}
.page-text-content strong{color:#fff;font-weight:600}
.page-text-content ul{list-style:none;margin-bottom:32px;display:flex;flex-direction:column;gap:16px}
.page-text-content li{position:relative;padding-left:22px;color:var(--text-muted)}
.page-text-content li::before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--accent-blue);box-shadow:0 0 8px var(--accent-glow)}
.page-text-content li strong{color:#f8fafc}

.page-cta-box{margin-top:50px;padding-top:30px;border-top:1px solid var(--border-color);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px}
.page-cta-box span{color:var(--text-muted);font-weight:300;font-size:1.02rem}

/* PAGE IMAGES — наредени една под друга, поголема резолуција на приказ */
.media-card{margin:40px 0;border-radius:22px;overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(0,210,255,calc(.08 + .92*var(--f,0)));box-shadow:0 0 calc(42px*var(--f,0)) rgba(0,210,255,calc(.45*var(--f,0))),0 calc(20px + 8px*var(--f,0)) calc(50px + 10px*var(--f,0)) rgba(0,0,0,.55)}
.media-card img{display:block;width:100%;max-height:640px;object-fit:contain}
.media-card figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--border-color);background:rgba(5,8,17,.6)}
.mc-title{font-size:1.05rem;font-weight:600;letter-spacing:-.005em;color:#fff}
.mc-more{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 22px;border-radius:980px;background:linear-gradient(135deg,#00d2ff 0%,#0072ff 100%);color:#fff;text-decoration:none;font-weight:600;font-size:.85rem;box-shadow:0 4px 16px rgba(0,210,255,.28);transition:transform .3s,box-shadow .3s}
.mc-more::after{content:"\2192";transition:transform .3s}
.mc-more:hover{transform:scale(1.03);box-shadow:0 6px 24px rgba(0,210,255,.5)}
.mc-more:hover::after{transform:translateX(3px)}
.page-gallery{display:flex;flex-direction:column;gap:56px;margin:40px 0}
.page-gallery .media-card{margin:0}

/* SCROLL REVEAL (Apple-style fluid feel) */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);will-change:opacity,transform}
.reveal.in-view{opacity:1;transform:none}

/* SCROLL-ВРЗАН "APPLE" ЗУМ: елементот во центарот на екранот се приближува кон корисникот,
   претходниот се враќа назад во позадина. Вредностите ги поставува JS (transform/opacity/--f) во секој кадар. */
.fx{will-change:transform,opacity;transform-origin:50% 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@media (prefers-reduced-motion:reduce){.fx{transform:none!important;opacity:1!important;--f:.6}}

/* CONTACT */
.contact-section{padding:90px 20px 100px;text-align:center;background:radial-gradient(circle at 50% 100%,rgba(0,210,255,.08) 0%,transparent 70%);border-top:1px solid var(--border-color)}
.contact-container{max-width:760px;margin:0 auto}
.contact-company{font-size:.85rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-blue);margin-bottom:10px}
.contact-headline{font-size:clamp(1.4rem,3.2vw,1.9rem);font-weight:700;letter-spacing:-.01em;color:#fff;margin-bottom:12px;line-height:1.25}
.contact-lead{font-size:.95rem;color:var(--text-muted);font-weight:300;line-height:1.6;margin:0 auto 28px;max-width:620px}
.contact-details-grid{display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.contact-link{font-size:.95rem;font-weight:500;color:#fff;text-decoration:none;padding:8px 2px;transition:color .3s;overflow-wrap:anywhere}
.contact-link:hover{color:var(--accent-blue)}
.contact-loc{color:var(--text-muted);font-size:.9rem}
.contact-divider{width:4px;height:4px;border-radius:50%;background:var(--text-muted);opacity:.5}
.social-btns{display:flex;justify-content:center;gap:12px}
.btn-social{padding:10px 22px;min-height:44px;border-radius:980px;text-decoration:none;font-size:.85rem;font-weight:600;transition:all .3s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.viber{background:rgba(115,96,242,.12);color:#a294ff;border:1px solid rgba(115,96,242,.3)}
.viber:hover{background:#7360f2;color:#fff;box-shadow:0 0 20px rgba(115,96,242,.4);transform:translateY(-2px)}
.whatsapp{background:rgba(37,211,102,.12);color:#52ea8a;border:1px solid rgba(37,211,102,.3)}
.whatsapp:hover{background:#25d366;color:#fff;box-shadow:0 0 20px rgba(37,211,102,.4);transform:translateY(-2px)}

/* COOKIE */
#cookie-banner{position:fixed;bottom:calc(16px + var(--safe-bottom));left:16px;right:16px;max-width:680px;margin:0 auto;background:rgba(15,23,42,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);padding:16px 22px;border-radius:16px;z-index:2000;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .4s,opacity .4s}
#cookie-banner.hidden{transform:translateY(140%);opacity:0;pointer-events:none;visibility:hidden}
.cookie-text{font-size:.82rem;color:var(--text-muted);line-height:1.5;font-weight:300}
.btn-cookie{background:rgba(255,255,255,.15);color:#fff;border:none;padding:10px 20px;min-height:40px;border-radius:980px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-cookie:hover{background:var(--accent-blue);color:#050811}
footer{text-align:center;padding:24px 20px calc(24px + var(--safe-bottom));border-top:1px solid var(--border-color);color:var(--text-muted);font-size:.75rem}

/* ЦЕЛОСНО НЕЗАВИСНИ АНИМАЦИИ ЗА СЕКОЕ ЛОГО ПООДДЕЛНО ВО "ЗА НАС" */
.about-stars-bg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;pointer-events:none;z-index:1}
.star-brand{
  position:absolute;
  top:var(--randY);
  left:var(--randX);
  opacity: 0;
  transition: opacity 1.8s ease-in-out, transform 1.8s ease-in-out;
  filter: drop-shadow(0 0 10px rgba(0,210,255,0.3));
}
.star-brand.active-brand {
  opacity: var(--randOp);
  transform: scale(1);
}
.star-brand svg{height:30px;width:auto}
.star-brand svg text,.star-brand svg circle,.star-brand svg rect,.star-brand svg path{opacity:.92}

@media (prefers-reduced-motion:reduce){.star-brand{transition:none}}

/* LARGE SCREENS */
@media (min-width:1600px){html{font-size:112.5%}.nav-container{max-width:1200px}.systems-wrapper{max-width:920px}.page-container{max-width:920px}}
/* TABLET */
@media (min-width:769px) and (max-width:1024px){.nav-container{padding:0 28px}.systems-wrapper,.page-container{max-width:720px}}
/* PHONE */
@media (max-width:768px){
  .nav-container{padding:0 12px 0 18px}
  .lang-switch{margin-left:auto}
  .menu-btn{display:flex}
  .nav-links{position:fixed;left:0;right:0;top:var(--hh);flex-direction:column;align-items:stretch;gap:0;background:rgba(5,8,17,.97);padding:4px 22px 12px;border-bottom:1px solid var(--border-color);transform:translateY(-130%);visibility:hidden;transition:transform .35s,visibility .35s}
  .nav-links.open{transform:none;visibility:visible}
  .nav-links a{display:block;padding:16px 0;font-size:1.05rem;border-bottom:1px solid var(--border-color)}
  .nav-links li:last-child a{border-bottom:0}
  .hero{padding:90px 18px 56px}
  .btn-cta{width:100%}
  .systems-wrapper{padding:30px 16px 70px;gap:26px}
  .system-card{padding:26px 22px;border-radius:20px}
  .card-icon{font-size:1.8rem}
  .system-card h3{font-size:1.3rem}
  .system-card p{font-size:.98rem}
  .page-container{padding:24px 18px 80px}
  .page-cta-box{flex-direction:column;align-items:stretch;text-align:center}
  .contact-section{padding:60px 18px 70px}
  .contact-divider{display:none}
  .contact-details-grid{flex-direction:column;gap:6px}
  .social-btns{flex-direction:column}
  .btn-social{width:100%}
  #cookie-banner{flex-direction:column;align-items:stretch;text-align:center;gap:12px}
}
@media (max-width:360px){.logo-text{font-size:.82rem}.logo-box{gap:8px}.lang-btn{padding:4px 8px}}
@media (max-height:480px) and (orientation:landscape){.hero{min-height:auto;padding-top:80px}}
@media (hover:none){.btn-cta:hover{transform:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){header{background:rgba(5,8,17,.97)}#cookie-banner{background:rgba(15,23,42,.98)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
const i18n = {
mk: {

function buildPages() {
  const t = (tag, key, cls) => `<${tag}${cls ? ' class="' + cls + '"' : ''} data-i18n="${key}"></${tag}>`;
  let html = '';
  for (const [id, [pre, ...blocks]] of Object.entries(pages)) {
    const imgs = pageImages[id];
    const fig = ([src, d]) => `<figure class="media-card"><img src="${src}" alt="" data-i18n-alt="${d ? 'dt-' + d + '-title' : pre + '-title'}" loading="lazy">` +
      (d ? `<figcaption><span class="mc-title" data-i18n="dt-${d}-title"></span><a class="mc-more" href="#detail-${d}" data-i18n="btn-details"></a></figcaption>` : '') + `</figure>`;
    let imgHtml = '';
    if (imgs) {
      imgHtml += fig(imgs.hero);
      if (imgs.gallery.length) imgHtml += '<div class="page-gallery">' + imgs.gallery.map(fig).join('') + '</div>';
    }

    let body = '';
    blocks.forEach(([type, a, b], idx) => {
      if (type === 'p') body += t('p', `${pre}-${a}`, 'reveal');
      else if (type === 'h') body += t('h2', `${pre}-${a}`, 'reveal');
      else {
        body += '<ul class="reveal">';
        for (let n = a; n <= b; n++) {
          body += type === 'l'
            ? `<li><strong data-i18n="${pre}-li${n}-title"></strong> <span data-i18n="${pre}-li${n}-desc"></span></li>`
            : `<li data-i18n="${pre}-li${n}"></li>`;
        }
        body += '</ul>';
      }
      /* сликите се вметнуваат по првиот блок (вовед-пасус), т.е. некаде во средината на текстот */
      if (idx === 0 && imgHtml) { body += imgHtml; imgHtml = ''; }
    });
    if (imgHtml) body += imgHtml; // fallback ако нема блокови

    let starsHtml = '';
    if (id === 'about') {
      starsHtml = '<div class="about-stars-bg" aria-hidden="true" id="teleport-container">';
      brandSvgs.forEach((svgContent, idx) => {
        starsHtml += `<div class="star-brand" id="brand-item-${idx}">${svgContent}</div>`;
      });
      starsHtml += '</div>';
    }

    html += `<div id="view-${id}" class="view-section">
      ${starsHtml}
      <div class="page-container">
      <a class="back-nav" href="${id.startsWith('detail-') ? '#' + DETAIL_PARENT[id.slice(7)].parent : '#systems'}">&larr; <span data-i18n="${id.startsWith('detail-') ? 'back-prev' : 'back-home'}"></span></a>
      ${t('h1', pre + '-title', 'page-title')}
      <div class="page-text-content">${body}</div>
      <div class="page-cta-box"><span data-i18n="page-cta-text"></span>
        <a href="#contact" class="btn-cta" data-i18n="modal-cta"></a></div>
    </div></div>`;
  }
  document.getElementById('subpages').innerHTML = html;
}

function setLanguage(lang, save) {
  if (!i18n[lang]) lang = 'mk';
  document.documentElement.lang = lang === 'mk' ? 'mk' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = i18n[lang][el.dataset.i18n];
    if (v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-alt]').forEach(el => {
    const v = i18n[lang][el.dataset.i18nAlt];
    if (v !== undefined) el.setAttribute('alt', v);
  });
  document.querySelectorAll('[data-src-mk][data-src-en]').forEach(el => {
    const v = lang === 'en' ? el.dataset.srcEn : el.dataset.srcMk;
    if (v && el.getAttribute('src') !== v) el.setAttribute('src', v);
  });
  document.title = i18n[lang]['page-title'];
  ['mk', 'en'].forEach(l => {
    const b = document.getElementById('btn-' + l);
    b.classList.toggle('active', l === lang);
    b.setAttribute('aria-pressed', l === lang);
  });
  document.getElementById('menu-btn').setAttribute('aria-label', lang === 'mk' ? 'Мени' : 'Menu');
  if (save) { try { localStorage.setItem('velder_lang', lang); } catch (e) {} }
}

const menuBtn = document.getElementById('menu-btn');

function closeMenu() {
  navLinks.classList.remove('open');
  menuBtn.classList.remove('open');
  menuBtn.setAttribute('aria-expanded', 'false');
}
menuBtn.addEventListener('click', () => {
  const open = navLinks.classList.toggle('open');
  menuBtn.classList.toggle('open', open);
  menuBtn.setAttribute('aria-expanded', open);
});
navLinks.addEventListener('click', e => { if (e.target.closest('a')) closeMenu(); });
window.addEventListener('resize', () => { if (innerWidth > 768) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

function route() {
  let hash = decodeURIComponent(location.hash.slice(1));
  if (hash === 'systems') hash = '';
  const view = pages[hash] ? hash : 'home';
  const next = document.getElementById('view-' + view);
  const current = document.querySelector('.view-section.active-view');
  closeMenu();
  const anchorTarget = view === 'home' && hash && document.getElementById(hash);

  if (current !== next) {
    /* флуид crossfade + слајд транзиција меѓу подстраниците, слично на apple.com */
    if (current) {
      current.classList.remove('view-in');
      setTimeout(() => current.classList.remove('active-view'), 520);
    }
    next.classList.add('active-view');
    void next.offsetHeight; /* reflow за да тргне транзицијата од почетна состојба */
    if (!anchorTarget) window.scrollTo({ top: 0, behavior: 'auto' });
    requestAnimationFrame(() => requestAnimationFrame(() => next.classList.add('view-in')));
  } else if (!next.classList.contains('view-in')) {
    requestAnimationFrame(() => next.classList.add('view-in'));
  }
  if (anchorTarget) anchorTarget.scrollIntoView({ behavior: 'smooth' });
  fxReset();
}
window.addEventListener('hashchange', route);

function initIndependentBrands() {
  const container = document.getElementById('teleport-container');
  if (!container) return;
  const items = container.querySelectorAll('.star-brand');
  
  items.forEach(el => {
    function runBrandCycle() {
      const randomX = Math.floor(Math.random() * 75) + 8;
      const randomY = Math.floor(Math.random() * 75) + 12;
      const randomOpacity = (Math.random() * 0.22 + 0.18).toFixed(2);
      
      el.style.setProperty('--randX', randomX + '%');
      el.style.setProperty('--randY', randomY + '%');
      el.style.setProperty('--randOp', randomOpacity);
      
      const visibleDuration = Math.floor(Math.random() * 3000) + 3000;
      const hiddenDuration = Math.floor(Math.random() * 2500) + 1500;

      setTimeout(() => {
        el.classList.add('active-brand');
        setTimeout(() => {
          el.classList.remove('active-brand');
          setTimeout(runBrandCycle, hiddenDuration);
        }, visibleDuration);
      }, 200);
    }
    setTimeout(runBrandCycle, Math.random() * 2000);
  });
}

/* ФЛУИД SCROLL-REVEAL за текстуалните блокови на подстраниците */
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      en.target.classList.add('in-view');
      revealObserver.unobserve(en.target);
    }
  });
}, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
function observeReveals() {
  document.querySelectorAll('.reveal').forEach((el, i) => {
    el.style.transitionDelay = Math.min(i % 6, 5) * 70 + 'ms';
    revealObserver.observe(el);
  });
}

/* ===== SCROLL-ВРЗАНА ТРАНЗИЦИЈА (apple.com стил) =====
   x = растојание на центарот на елементот од центарот на екранот (во висини на екранот):
   x > 0  → елементот допрва доаѓа од долу: мал и проѕирен, "се приближува" кон екранот додека не стигне во центар
   x = 0  → скала 1, полна јасност, неонска рамка
   x < 0  → елементот заминува нагоре: лесно се намалува и затемнува (се враќа назад во позадина)
   Бидејќи сè е функција од позицијата на скролот, ефектот е совршено реверзибилен (скрол надолу и нагоре). */
const reduceMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
const FX = {
  hero: { sIn:0,   sOut:.14, span:1.0,  oInMin:1,   oInStart:0,   oInSpan:1,   oOutMin:0,   oOutStart:.02, oOutSpan:.75, fSpan:.5 },
  card: { sIn:.16, sOut:.09, span:.8,   oInMin:.25, oInStart:.08, oInSpan:.6,  oOutMin:.3,  oOutStart:.08, oOutSpan:.6,  fSpan:.4 },
  img:  { sIn:.30, sOut:.14, span:.9,   oInMin:0,   oInStart:.05, oInSpan:.75, oOutMin:.15, oOutStart:.1,  oOutSpan:.6,  fSpan:.5 }
};
const fxItems = [];
const clamp01 = x => Math.min(1, Math.max(0, x));
const smooth = x => x * x * (3 - 2 * x);
const lerp = (a, b, k) => a + (b - a) * k;
let fxRaf = 0, fxUntil = 0;

function registerFx() {
  [['.hero','hero'],['.system-card','card'],['.media-card','img']].forEach(([sel, kind]) => {
    document.querySelectorAll(sel).forEach(el => {
      el.classList.add('fx');
      fxItems.push({ el, p: FX[kind], v: null });
    });
  });
}
function fxSchedule() { if (!fxRaf && !reduceMotion) fxRaf = requestAnimationFrame(fxFrame); }
function fxHold(ms) { fxUntil = Math.max(fxUntil, performance.now() + ms); fxSchedule(); }
function fxReset() { fxItems.forEach(it => { it.v = null; }); fxHold(1100); }

function fxFrame() {
  fxRaf = 0;
  const vh = innerHeight || 1, mid = vh / 2;
  let busy = false;
  const jobs = [];
  /* 1) читање (без mixing со запишување → нема layout thrash) */
  for (const it of fxItems) {
    const el = it.el;
    if (!el.getClientRects().length) { it.v = null; continue; } /* скриена подстраница */
    const r = el.getBoundingClientRect();
    const x = ((r.top + r.bottom) / 2 - mid) / vh;
    if (it.v !== null && (r.bottom < -vh || r.top > 2 * vh)) { it.v = x; continue; } /* далеку надвор од екранот */
    if (it.v === null) it.v = x;
    else {
      it.v += (x - it.v) * 0.24; /* благо "инерцијално" измазнување на точките од тркалцето */
      if (Math.abs(x - it.v) > 0.0004) busy = true; else it.v = x;
    }
    jobs.push(it);
  }
  /* 2) запишување */
  for (const it of jobs) {
    const p = it.p, x = it.v;
    let s, o;
    if (x >= 0) {
      s = 1 - p.sIn * smooth(clamp01(x / p.span));
      o = lerp(1, p.oInMin, smooth(clamp01((x - p.oInStart) / p.oInSpan)));
    } else {
      const a = -x;
      s = 1 - p.sOut * smooth(clamp01(a / p.span));
      o = lerp(1, p.oOutMin, smooth(clamp01((a - p.oOutStart) / p.oOutSpan)));
    }
    const f = 1 - smooth(clamp01(Math.abs(x) / p.fSpan));
    const st = it.el.style;
    st.transform = 'scale(' + s.toFixed(4) + ')';
    st.opacity = o.toFixed(3);
    st.setProperty('--f', f.toFixed(3));
  }
  if (busy || performance.now() < fxUntil) fxSchedule();
}
addEventListener('scroll', fxSchedule, { passive: true });
addEventListener('resize', () => fxHold(300));
addEventListener('load', () => fxHold(900));
document.addEventListener('load', fxSchedule, true); /* ленивите слики ја менуваат висината кога ќе се вчитаат */

buildPages();
registerFx();
initIndependentBrands();
observeReveals();

let startLang = 'mk';
try { startLang = localStorage.getItem('velder_lang') || 'mk'; } catch (e) {}
setLanguage(startLang);
document.getElementById('btn-mk').addEventListener('click', () => setLanguage('mk', true));
document.getElementById('btn-en').addEventListener('click', () => setLanguage('en', true));
route();
</script>
</body>
